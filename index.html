<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>応援歌運指表</title>
<style>
  :root{
    --paper:#FFFFFF;
    --paper-card:#FFFFFF;
    --ink:#0A0A0A;
    --ink-soft:#3A3A3A;
    --ink-faint:#8A8A8A;
    --line:#D6D6D8;
    --brass:#54585D;
    --brass-deep:#0A0A0A;
    --brass-light:#EFEFF0;
    --wine:#C8102E;
    --wine-light:#FBE3E7;
    --shadow: 0 1px 2px rgba(0,0,0,0.08), 0 6px 20px rgba(0,0,0,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  a{color:var(--brass-deep);}
  button{font-family:inherit;}
  button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--brass);
    outline-offset:2px;
  }

  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:20px 18px 96px;
  }

  /* ---------- Header ---------- */
  header.app-head{
    padding-top:6px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .brand h1{
    font-family:inherit;
    font-weight:900;
    font-size:1.55rem;
    letter-spacing:.04em;
    margin:0;
  }
  .brand-sub{
    margin:2px 0 0;
    font-size:.8rem;
    color:var(--ink-faint);
    letter-spacing:.04em;
  }

  .staff{
    height:20px;
    margin:14px 0 18px;
    background-image:
      repeating-linear-gradient(
        var(--line), var(--line) 1px, transparent 1px, transparent 5px
      );
    background-size: 100% 20px;
    background-repeat:no-repeat;
    border-bottom:2.5px solid var(--ink);
    opacity:1;
  }
  .staff.thin{ height:12px; margin:10px 0; background-size:100% 12px; border-bottom-width:1.5px; opacity:.85;}

  /* ---------- Toolbar ---------- */
  .toolbar{
    display:flex;
    gap:8px;
    margin-bottom:18px;
  }
  .search-box{
    flex:1;
    position:relative;
  }
  .search-box input{
    width:100%;
    padding:11px 34px 11px 38px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--paper-card);
    color:var(--ink);
    font-size:.92rem;
  }
  .search-box input::placeholder{ color:var(--ink-faint); }
  .search-box svg{
    position:absolute;
    left:12px; top:50%; transform:translateY(-50%);
    width:16px; height:16px;
    stroke:var(--ink-faint);
  }
  .search-clear{
    display:none;
    position:absolute;
    right:8px; top:50%; transform:translateY(-50%);
    width:22px; height:22px;
    border:none;
    background:transparent;
    color:var(--ink-faint);
    cursor:pointer;
    border-radius:50%;
    padding:0;
    margin:0;
    line-height:0;
  }
  .search-clear:hover{ background:var(--brass-light); color:var(--ink); }
  .search-clear.show{ display:block; }
  .search-clear svg{
    display:block;
    position:absolute;
    left:50%; top:50%;
    transform:translate(-50%, -50%);
    width:14px; height:14px;
    stroke:currentColor;
  }
  .btn-add{
    display:flex; align-items:center; gap:6px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:8px;
    padding:0 16px;
    font-size:.88rem;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  }
  .btn-add:hover{ background:var(--brass-deep); }
  .btn-add svg{ width:15px; height:15px; stroke:currentColor; }

  .io-row{
    display:flex;
    gap:8px;
    margin-bottom:14px;
  }
  .io-row .icon-btn{ font-size:.78rem; padding:7px 12px; }

  .count-line{
    font-size:.78rem;
    color:var(--ink-faint);
    margin:0 0 10px 2px;
    letter-spacing:.03em;
  }

  /* ---------- Tabs ---------- */
  .tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    margin-bottom:14px;
    padding-bottom:2px;
  }
  .tabs::-webkit-scrollbar{ display:none; }

  .kana-tabs{
    scrollbar-width:thin;
    scrollbar-color: var(--brass) transparent;
    padding-bottom:8px;
    margin-bottom:10px;
  }
  .kana-tabs::-webkit-scrollbar{
    display:block;
    height:5px;
  }
  .kana-tabs::-webkit-scrollbar-track{
    background:var(--brass-light);
    border-radius:3px;
  }
  .kana-tabs::-webkit-scrollbar-thumb{
    background:var(--brass);
    border-radius:3px;
  }
  .tab-btn{
    flex:none;
    display:flex;
    align-items:center;
    gap:6px;
    background:#fff;
    border:1.5px solid var(--line);
    color:var(--ink-soft);
    border-radius:20px;
    padding:7px 14px;
    font-size:.8rem;
    font-weight:700;
    font-family:inherit;
    letter-spacing:.02em;
    white-space:nowrap;
    cursor:pointer;
  }
  .tab-btn .tab-count{
    font-family:inherit;
    font-size:.72rem;
    font-weight:600;
    color:var(--ink-faint);
  }
  .tab-btn.active{
    background:var(--ink);
    border-color:var(--ink);
    color:#fff;
  }
  .tab-btn.active .tab-count{ color:#fff; opacity:.75; }
  .tab-btn:hover:not(.active){ border-color:var(--ink); }

  .cat-chip{
    display:inline-block;
    font-size:.66rem;
    font-weight:700;
    letter-spacing:.02em;
    color:#fff;
    background:var(--ink);
    padding:2px 8px;
    border-radius:4px;
    white-space:nowrap;
  }

  /* ---------- List ---------- */
  #list{ display:flex; flex-direction:column; gap:10px; }

  .card{
    background:var(--paper-card);
    border:1px solid var(--line);
    border-left:3px solid transparent;
    border-radius:8px;
    box-shadow:var(--shadow);
    overflow:hidden;
    transition:border-color .15s ease;
  }
  .card.open{ border-left-color:var(--ink); }
  .card-head{
    display:flex;
    align-items:center;
    gap:10px;
    padding:13px 14px;
    cursor:pointer;
  }
  .card-head:hover{ background:var(--brass-light); }
  .chev{
    width:16px; height:16px; flex:none;
    stroke:var(--ink-faint);
    transition:transform .15s ease;
  }
  .card.open .chev{ transform:rotate(90deg); }

  .card-title-wrap{ flex:1; min-width:0; }
  .card-title{
    font-family:inherit;
    font-weight:700;
    font-size:.92rem;
    margin:0 0 3px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .card-meta{
    display:flex; gap:8px; align-items:center;
    font-size:.7rem;
    color:var(--ink-faint);
  }
  .finger-chip{
    display:inline-block;
    font-family:inherit;
    font-size:.68rem;
    letter-spacing:.03em;
    background:var(--brass-light);
    color:var(--brass-deep);
    padding:2px 7px;
    border-radius:5px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    max-width:180px;
  }
  .link-dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--brass);
    flex:none;
  }

  .card-body{
    display:none;
    padding:0 16px 16px;
    border-top:1px dashed var(--line);
  }
  .card.open .card-body{ display:block; }

  .sec{ margin-top:14px; }
  .sec-label{
    font-size:.72rem;
    font-weight:600;
    letter-spacing:.08em;
    color:var(--brass-deep);
    display:flex; align-items:center; gap:6px;
    margin-bottom:6px;
  }
  .sec-label svg{ width:13px; height:13px; stroke:var(--brass-deep); }
  .lyrics-box{
    white-space:pre-wrap;
    line-height:1.9;
    font-size:.92rem;
    color:var(--ink);
    background:transparent;
  }
  .fingering-box{
    white-space:pre-wrap;
    font-family:inherit;
    font-size:.86rem;
    letter-spacing:.03em;
    line-height:1.8;
    color:var(--brass-deep);
    background:var(--brass-light);
    border-radius:8px;
    padding:10px 12px;
  }
  .fingering-box.harmony{
    color:var(--wine);
    background:var(--wine-light);
  }
  .muted-note{ color:var(--ink-faint); font-size:.85rem; }
  .sheet-link{
    display:inline-flex; align-items:center; gap:6px;
    font-size:.88rem;
    font-weight:600;
    color:var(--brass-deep);
    text-decoration:none;
    border-bottom:1px solid var(--brass);
    padding-bottom:1px;
  }
  .sheet-link svg{ width:14px; height:14px; stroke:currentColor; }

  .card-actions{
    display:flex; gap:8px;
    margin-top:16px;
    padding-top:12px;
    border-top:1px solid var(--line);
  }
  .icon-btn{
    display:flex; align-items:center; gap:5px;
    background:none;
    border:1px solid var(--line);
    border-radius:7px;
    padding:7px 12px;
    font-size:.8rem;
    font-weight:600;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .icon-btn svg{ width:14px; height:14px; stroke:currentColor; }
  .icon-btn:hover{ background:var(--brass-light); color:var(--brass-deep); border-color:var(--brass); }
  .icon-btn.danger:hover{ background:var(--wine-light); color:var(--wine); border-color:var(--wine); }

  /* ---------- Empty state ---------- */
  .empty{
    text-align:center;
    padding:50px 20px;
    color:var(--ink-faint);
  }
  .empty .note{ font-size:1.6rem; color:var(--line); }
  .empty p{ font-size:.9rem; margin:10px 0 18px; }
  .empty .btn-add{ margin:0 auto; padding:10px 18px; }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0;
    background:rgba(34,38,43,0.45);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:50;
  }
  .overlay.show{ display:flex; }
  @media (min-width:640px){
    .overlay{ align-items:center; }
  }

  .modal{
    background:var(--paper-card);
    width:100%;
    max-width:560px;
    max-height:88vh;
    overflow-y:auto;
    border-radius:16px 16px 0 0;
    padding:20px 20px calc(20px + env(safe-area-inset-bottom));
  }
  @media (min-width:640px){
    .modal{ border-radius:14px; padding:24px; }
  }
  .modal h2{
    font-family:inherit;
    font-size:1.2rem;
    margin:0 0 4px;
  }
  .modal .modal-sub{
    font-size:.78rem; color:var(--ink-faint); margin:0 0 14px;
  }
  .field{ margin-bottom:14px; }
  .field label{
    display:block;
    font-size:.78rem;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:5px;
    letter-spacing:.02em;
  }
  .field .opt{ font-weight:400; color:var(--ink-faint); }
  .field input, .field textarea, .field select{
    width:100%;
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 12px;
    font-size:.9rem;
    font-family:inherit;
    background:#fff;
    color:var(--ink);
    resize:vertical;
  }
  .field textarea{ min-height:90px; line-height:1.7; }
  .field textarea.mono{ font-family:inherit; font-size:.85rem; min-height:70px; }
  .field .err{ font-size:.75rem; color:var(--wine); margin-top:4px; display:none; }
  .field.invalid input{ border-color:var(--wine); }
  .field.invalid .err{ display:block; }

  .modal-actions{
    display:flex; gap:10px; margin-top:18px;
  }
  .btn-primary, .btn-ghost, .btn-danger-solid{
    flex:1;
    border:none;
    border-radius:8px;
    padding:12px;
    font-size:.9rem;
    font-weight:600;
    cursor:pointer;
  }
  .btn-primary{ background:var(--ink); color:var(--paper); }
  .btn-primary:hover{ background:var(--brass-deep); }
  .btn-ghost{ background:transparent; color:var(--ink-soft); border:1px solid var(--line); }
  .btn-ghost:hover{ background:rgba(0,0,0,0.03); }
  .btn-danger-solid{ background:var(--wine); color:#fff; }
  .btn-danger-solid:hover{ background:#5f232c; }

  .confirm-body{ font-size:.9rem; color:var(--ink-soft); line-height:1.7; margin-bottom:4px; }
  .confirm-title{ font-weight:700; color:var(--ink); }

  /* ---------- Toast ---------- */
  #toast{
    position:fixed;
    bottom:20px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink);
    color:var(--paper);
    padding:10px 18px;
    border-radius:8px;
    font-size:.83rem;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    z-index:100;
    max-width:90%;
    text-align:center;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .loading{
    text-align:center;
    padding:60px 0;
    color:var(--ink-faint);
    font-size:.85rem;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>

<div class="wrap" id="appRoot">
  <header class="app-head">
    <div class="brand">
      <h1>応援歌運指表</h1>
    </div>
    <div class="staff"></div>
  </header>

  <div class="toolbar">
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" type="text" placeholder="曲名・ふりがなで検索" autocomplete="off">
      <button type="button" class="search-clear" id="searchClearBtn" aria-label="検索文字をクリア">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <button class="btn-add" id="openAddBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      新規登録
    </button>
  </div>

  <div class="io-row">
    <button type="button" class="icon-btn" id="exportBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      書き出し
    </button>
    <button type="button" class="icon-btn" id="importBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      読み込み
    </button>
    <input type="file" id="importFile" accept="application/json" hidden>
  </div>

  <div class="tabs" id="tabsBar"></div>
  <div class="tabs kana-tabs" id="kanaTabsBar"></div>

  <p class="count-line" id="countLine"></p>

  <div id="list"></div>
</div>

<div id="toast"></div>

<!-- 追加/編集モーダル -->
<div class="overlay" id="formOverlay">
  <div class="modal">
    <h2 id="formTitle">曲を登録</h2>
    <p class="modal-sub">入力した内容はこの端末に保存されます</p>
    <form id="songForm" novalidate>
      <input type="hidden" id="songId">
      <div class="field" id="titleField">
        <label for="titleInput">曲名<span class="opt">（必須）</span></label>
        <input id="titleInput" type="text" placeholder="例）練習曲第一番" maxlength="80">
        <p class="err">曲名を入力してください</p>
      </div>
      <div class="field">
        <label for="furiganaInput">ふりがな<span class="opt">（任意・検索用／一覧には表示されません）</span></label>
        <input id="furiganaInput" type="text" placeholder="例）れんしゅうきょくだいいちばん" maxlength="120">
      </div>
      <div class="field">
        <label for="categoryInput">カテゴリ<span class="opt">（必須）</span></label>
        <select id="categoryInput"></select>
      </div>
      <div class="field">
        <label for="lyricsInput">歌詞<span class="opt">（任意）</span></label>
        <textarea id="lyricsInput" placeholder="歌詞を貼り付け・入力"></textarea>
      </div>
      <div class="field">
        <label for="fingeringInput">指番号<span class="opt">(任意)</span></label>
        <textarea class="mono" id="fingeringInput" placeholder="例)1-2-3-1-2-3-4-5&#10;歌詞の行に合わせて入力すると見やすくなります"></textarea>
      </div>
      <div class="field">
        <label for="fingeringHarmonyInput">ハモリ指番号<span class="opt">(任意)</span></label>
        <textarea class="mono" id="fingeringHarmonyInput" placeholder="例)ハモリパートの指番号"></textarea>
      </div>
      <div class="field" id="urlField">
        <label for="urlInput">楽譜へのリンク<span class="opt">（任意）</span></label>
        <input id="urlInput" type="url" placeholder="https://...">
        <p class="err">URLの形式で入力してください</p>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-ghost" id="cancelFormBtn">キャンセル</button>
        <button type="submit" class="btn-primary">保存する</button>
      </div>
    </form>
  </div>
</div>

<!-- 削除確認モーダル -->
<div class="overlay" id="deleteOverlay">
  <div class="modal">
    <h2>削除の確認</h2>
    <p class="confirm-body">「<span class="confirm-title" id="deleteTargetName"></span>」を削除します。<br>この操作は取り消せません。</p>
    <div class="modal-actions">
      <button type="button" class="btn-ghost" id="cancelDeleteBtn">キャンセル</button>
      <button type="button" class="btn-danger-solid" id="confirmDeleteBtn">削除する</button>
    </div>
  </div>
</div>

<script>
(function(){
  const STORAGE_KEY = 'songs-data';
  const CATEGORIES = ['選手応援歌', 'ヒットテーマ', 'チャンステーマ', 'チーム応援歌'];
  const DEFAULT_CATEGORY = CATEGORIES[0];
  let songs = [];
  let openId = null;
  let editingId = null;
  let deleteTargetId = null;
  let loaded = false;
  let activeTab = '全て';
  let activeKana = '全て';

  const KANA_ROWS = [
    { label:'あ', chars:'あいうえおぁぃぅぇぉ' },
    { label:'か', chars:'かきくけこがぎぐげご' },
    { label:'さ', chars:'さしすせそざじずぜぞ' },
    { label:'た', chars:'たちつてとだぢづでどっ' },
    { label:'な', chars:'なにぬねの' },
    { label:'は', chars:'はひふへほばびぶべぼぱぴぷぺぽ' },
    { label:'ま', chars:'まみむめも' },
    { label:'や', chars:'やゆよゃゅょ' },
    { label:'ら', chars:'らりるれろ' },
    { label:'わ', chars:'わをんゎ' }
  ];

  function toHiragana(ch){
    const code = ch.charCodeAt(0);
    if(code >= 0x30A1 && code <= 0x30F6){
      return String.fromCharCode(code - 0x60);
    }
    return ch;
  }

  function getKanaRowLabel(s){
    const src = (s.furigana && s.furigana.trim()) ? s.furigana.trim() : (s.title || '').trim();
    if(!src) return null;
    const first = toHiragana(src[0]);
    const row = KANA_ROWS.find(r => r.chars.includes(first));
    return row ? row.label : null;
  }

  const listEl = document.getElementById('list');
  const countLine = document.getElementById('countLine');
  const searchInput = document.getElementById('searchInput');
  const searchClearBtn = document.getElementById('searchClearBtn');
  const tabsBar = document.getElementById('tabsBar');
  const kanaTabsBar = document.getElementById('kanaTabsBar');

  const escapeHtml = (s='') => s.replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));

  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(()=> t.classList.remove('show'), 2200);
  }

  const hasCloudStorage = (typeof window !== 'undefined') && window.storage && typeof window.storage.get === 'function';

  async function storageGet(key){
    if(hasCloudStorage){
      try{
        const res = await window.storage.get(key, false);
        return res ? res.value : null;
      }catch(e){
        return null;
      }
    }
    try{
      return localStorage.getItem(key);
    }catch(e){
      return null;
    }
  }

  async function storageSet(key, value){
    if(hasCloudStorage){
      try{
        const res = await window.storage.set(key, value, false);
        return !!res;
      }catch(e){
        return false;
      }
    }
    try{
      localStorage.setItem(key, value);
      return true;
    }catch(e){
      return false;
    }
  }

  async function loadSongs(){
    try{
      const value = await storageGet(STORAGE_KEY);
      songs = value ? JSON.parse(value) : [];
      songs.forEach(s => { if(!s.category) s.category = DEFAULT_CATEGORY; });
    }catch(e){
      songs = [];
    }
    loaded = true;
    render();
  }

  async function persist(){
    const ok = await storageSet(STORAGE_KEY, JSON.stringify(songs));
    if(!ok){ toast('保存に失敗しました。もう一度お試しください'); }
  }

  function renderTabs(){
    const tabs = ['全て', ...CATEGORIES];
    tabsBar.innerHTML = tabs.map(t => {
      const count = t === '全て' ? songs.length : songs.filter(s => s.category === t).length;
      return `<button type="button" class="tab-btn ${t===activeTab?'active':''}" data-tab="${escapeHtml(t)}">
        ${escapeHtml(t)} <span class="tab-count">${count}</span>
      </button>`;
    }).join('');
    tabsBar.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', ()=>{
        activeTab = btn.dataset.tab;
        openId = null;
        render();
      });
    });
  }

  function renderKanaTabs(){
    const rows = ['全て', ...KANA_ROWS.map(r => r.label), 'その他'];
    kanaTabsBar.innerHTML = rows.map(t => {
      let count;
      if(t === '全て') count = songs.length;
      else if(t === 'その他') count = songs.filter(s => getKanaRowLabel(s) === null).length;
      else count = songs.filter(s => getKanaRowLabel(s) === t).length;
      return `<button type="button" class="tab-btn ${t===activeKana?'active':''}" data-kana="${escapeHtml(t)}">
        ${escapeHtml(t)} <span class="tab-count">${count}</span>
      </button>`;
    }).join('');
    kanaTabsBar.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', ()=>{
        activeKana = btn.dataset.kana;
        openId = null;
        render();
      });
    });
  }

  function sortedFiltered(){
    const q = searchInput.value.trim().toLowerCase();
    let arr = [...songs];
    if(activeTab !== '全て'){
      arr = arr.filter(s => s.category === activeTab);
    }
    if(activeKana !== '全て'){
      arr = arr.filter(s => {
        const label = getKanaRowLabel(s);
        return activeKana === 'その他' ? label === null : label === activeKana;
      });
    }
    if(q){
      arr = arr.filter(s =>
        s.title.toLowerCase().includes(q) ||
        (s.furigana && s.furigana.toLowerCase().includes(q))
      );
    }
    arr.sort((a,b)=>{
      const keyA = (a.furigana && a.furigana.trim()) ? a.furigana.trim() : a.title;
      const keyB = (b.furigana && b.furigana.trim()) ? b.furigana.trim() : b.title;
      return keyA.localeCompare(keyB, 'ja');
    });
    return arr;
  }

  function render(){
    renderTabs();
    renderKanaTabs();
    if(!loaded){
      listEl.innerHTML = '<div class="loading">読み込み中…</div>';
      countLine.textContent = '';
      return;
    }
    const arr = sortedFiltered();
    const q = searchInput.value.trim();

    if(songs.length === 0){
      listEl.innerHTML = `
        <div class="empty">
          <div class="note">♪</div>
          <p>まだ曲が登録されていません。<br>最初の一曲を登録してみましょう。</p>
          <button class="btn-add" id="emptyAddBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            曲を登録する
          </button>
        </div>`;
      countLine.textContent = '';
      document.getElementById('emptyAddBtn').addEventListener('click', openAddForm);
      return;
    }

    if(arr.length === 0){
      listEl.innerHTML = `
        <div class="empty">
          <div class="note">♪</div>
          <p>${q ? `「${escapeHtml(q)}」に一致する曲が見つかりません。` : `条件（${escapeHtml(activeTab)} / ${escapeHtml(activeKana)}）に一致する曲がありません。`}</p>
        </div>`;
      countLine.textContent = `全 ${songs.length} 曲`;
      return;
    }

    countLine.textContent = q ? `${arr.length} 件ヒット（全 ${songs.length} 曲）` : `${arr.length} 曲`;

    listEl.innerHTML = arr.map(s => cardHtml(s)).join('');

    arr.forEach(s => {
      const head = document.getElementById('head-'+s.id);
      head.addEventListener('click', () => toggleOpen(s.id));
      const editBtn = document.getElementById('edit-'+s.id);
      if(editBtn) editBtn.addEventListener('click', (e)=>{ e.stopPropagation(); openEditForm(s.id); });
      const delBtn = document.getElementById('del-'+s.id);
      if(delBtn) delBtn.addEventListener('click', (e)=>{ e.stopPropagation(); openDeleteConfirm(s.id); });
    });
  }

  function cardHtml(s){
    const isOpen = s.id === openId;
    return `
    <div class="card ${isOpen?'open':''}" id="card-${s.id}">
      <div class="card-head" id="head-${s.id}" role="button" tabindex="0" aria-expanded="${isOpen}">
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
        <div class="card-title-wrap">
          <p class="card-title">${escapeHtml(s.title)}</p>
          <div class="card-meta">
            <span class="cat-chip">${escapeHtml(s.category || DEFAULT_CATEGORY)}</span>
            ${s.sheetUrl ? `<span class="link-dot" title="楽譜リンクあり"></span>` : ''}
          </div>
        </div>
      </div>
      ${isOpen ? cardBody(s) : ''}
    </div>`;
  }

  function cardBody(s){
    return `
      <div class="card-body">
        <div class="sec">
          <p class="sec-label">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h10M4 18h13"/></svg>
            歌詞
          </p>
          ${s.lyrics ? `<div class="lyrics-box">${escapeHtml(s.lyrics)}</div>` : `<p class="muted-note">歌詞は未登録です</p>`}
        </div>
        <div class="sec">
          <p class="sec-label">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M9 18V5l12-2v13M9 9l12-2"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
            指番号
          </p>
          ${s.fingering ? `<div class="fingering-box">${escapeHtml(s.fingering)}</div>` : `<p class="muted-note">指番号は未登録です</p>`}
        </div>
        <div class="sec">
          <p class="sec-label">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M9 18V5l12-2v13M9 9l12-2"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
            ハモリ指番号
          </p>
          ${s.fingeringHarmony ? `<div class="fingering-box harmony">${escapeHtml(s.fingeringHarmony)}</div>` : `<p class="muted-note">ハモリ指番号は未登録です</p>`}
        </div>
        <div class="sec">
          <p class="sec-label">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M9 18V5l12-2v13M9 9l12-2"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
            楽譜
          </p>
          ${s.sheetUrl
            ? `<a class="sheet-link" href="${escapeHtml(s.sheetUrl)}" target="_blank" rel="noopener noreferrer">
                 <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                 楽譜を見る
               </a>`
            : `<p class="muted-note">楽譜リンクは未登録です</p>`}
        </div>
        <div class="card-actions">
          <button type="button" class="icon-btn" id="edit-${s.id}">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            編集
          </button>
          <button type="button" class="icon-btn danger" id="del-${s.id}">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
            削除
          </button>
        </div>
      </div>`;
  }

  function toggleOpen(id){
    openId = (openId === id) ? null : id;
    render();
  }

  function updateSearchClearBtn(){
    searchClearBtn.classList.toggle('show', searchInput.value.length > 0);
  }

  searchInput.addEventListener('input', ()=>{ updateSearchClearBtn(); render(); });

  searchClearBtn.addEventListener('click', ()=>{
    searchInput.value = '';
    updateSearchClearBtn();
    searchInput.focus();
    render();
  });

  updateSearchClearBtn();

  /* ---------- Export / Import ---------- */
  const exportBtn = document.getElementById('exportBtn');
  const importBtn = document.getElementById('importBtn');
  const importFile = document.getElementById('importFile');

  exportBtn.addEventListener('click', ()=>{
    if(songs.length === 0){
      toast('書き出せる曲がありません');
      return;
    }
    const blob = new Blob([JSON.stringify(songs, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const today = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `運指ノート_${today}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('書き出しました');
  });

  importBtn.addEventListener('click', ()=> importFile.click());

  importFile.addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async (ev)=>{
      try{
        const data = JSON.parse(ev.target.result);
        if(!Array.isArray(data)) throw new Error('invalid format');
        const validItems = data.filter(item => item && typeof item.title === 'string');
        if(validItems.length === 0) throw new Error('empty');

        const existingIds = new Set(songs.map(s=>s.id));
        let added = 0, updated = 0;
        validItems.forEach(item=>{
          if(!item.category) item.category = DEFAULT_CATEGORY;
          if(item.id && existingIds.has(item.id)){
            const idx = songs.findIndex(s=>s.id===item.id);
            songs[idx] = { ...songs[idx], ...item };
            updated++;
          } else {
            if(!item.id) item.id = (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(36).slice(2));
            songs.push(item);
            added++;
          }
        });
        render();
        await persist();
        toast(`読み込み完了(追加${added}件・更新${updated}件)`);
      }catch(err){
        toast('ファイルを読み込めませんでした。形式をご確認ください');
      }
      importFile.value = '';
    };
    reader.readAsText(file);
  });

  /* ---------- Form modal ---------- */
  const formOverlay = document.getElementById('formOverlay');
  const songForm = document.getElementById('songForm');
  const titleInput = document.getElementById('titleInput');
  const furiganaInput = document.getElementById('furiganaInput');
  const categoryInput = document.getElementById('categoryInput');
  const lyricsInput = document.getElementById('lyricsInput');
  const fingeringInput = document.getElementById('fingeringInput');
  const fingeringHarmonyInput = document.getElementById('fingeringHarmonyInput');
  const urlInput = document.getElementById('urlInput');
  const titleField = document.getElementById('titleField');
  const urlField = document.getElementById('urlField');
  const formTitle = document.getElementById('formTitle');

  categoryInput.innerHTML = CATEGORIES.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');

  function openAddForm(){
    editingId = null;
    formTitle.textContent = '曲を登録';
    songForm.reset();
    categoryInput.value = (activeTab !== '全て' && CATEGORIES.includes(activeTab)) ? activeTab : DEFAULT_CATEGORY;
    titleField.classList.remove('invalid');
    urlField.classList.remove('invalid');
    formOverlay.classList.add('show');
    setTimeout(()=> titleInput.focus(), 50);
  }

  function openEditForm(id){
    const s = songs.find(x=>x.id===id);
    if(!s) return;
    editingId = id;
    formTitle.textContent = '曲を編集';
    titleInput.value = s.title || '';
    furiganaInput.value = s.furigana || '';
    categoryInput.value = s.category || DEFAULT_CATEGORY;
    lyricsInput.value = s.lyrics || '';
    fingeringInput.value = s.fingering || '';
    fingeringHarmonyInput.value = s.fingeringHarmony || '';
    urlInput.value = s.sheetUrl || '';
    titleField.classList.remove('invalid');
    urlField.classList.remove('invalid');
    formOverlay.classList.add('show');
    setTimeout(()=> titleInput.focus(), 50);
  }

  function closeForm(){
    formOverlay.classList.remove('show');
    editingId = null;
  }

  document.getElementById('openAddBtn').addEventListener('click', openAddForm);
  document.getElementById('cancelFormBtn').addEventListener('click', closeForm);
  formOverlay.addEventListener('click', (e)=>{ if(e.target === formOverlay) closeForm(); });

  function isValidUrl(v){
    if(!v) return true;
    try{ new URL(v); return true; }catch(e){ return false; }
  }

  songForm.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const title = titleInput.value.trim();
    const url = urlInput.value.trim();
    let valid = true;

    if(!title){
      titleField.classList.add('invalid');
      valid = false;
    } else {
      titleField.classList.remove('invalid');
    }

    if(!isValidUrl(url)){
      urlField.classList.add('invalid');
      valid = false;
    } else {
      urlField.classList.remove('invalid');
    }

    if(!valid) return;

    const data = {
      title,
      furigana: furiganaInput.value.trim(),
      category: categoryInput.value || DEFAULT_CATEGORY,
      lyrics: lyricsInput.value.trim(),
      fingering: fingeringInput.value.trim(),
      fingeringHarmony: fingeringHarmonyInput.value.trim(),
      sheetUrl: url
    };

    if(editingId){
      const idx = songs.findIndex(x=>x.id===editingId);
      if(idx !== -1) songs[idx] = { ...songs[idx], ...data };
      toast('更新しました');
    } else {
      const id = (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(36).slice(2));
      songs.push({ id, ...data, createdAt: Date.now() });
      openId = id;
      toast('登録しました');
    }

    closeForm();
    render();
    await persist();
  });

  /* ---------- Delete modal ---------- */
  const deleteOverlay = document.getElementById('deleteOverlay');
  const deleteTargetName = document.getElementById('deleteTargetName');

  function openDeleteConfirm(id){
    const s = songs.find(x=>x.id===id);
    if(!s) return;
    deleteTargetId = id;
    deleteTargetName.textContent = s.title;
    deleteOverlay.classList.add('show');
  }
  function closeDeleteConfirm(){
    deleteOverlay.classList.remove('show');
    deleteTargetId = null;
  }
  document.getElementById('cancelDeleteBtn').addEventListener('click', closeDeleteConfirm);
  deleteOverlay.addEventListener('click', (e)=>{ if(e.target === deleteOverlay) closeDeleteConfirm(); });
  document.getElementById('confirmDeleteBtn').addEventListener('click', async ()=>{
    if(!deleteTargetId) return;
    songs = songs.filter(s=>s.id !== deleteTargetId);
    if(openId === deleteTargetId) openId = null;
    closeDeleteConfirm();
    render();
    toast('削除しました');
    await persist();
  });

  /* ---------- Init ---------- */
  loadSongs();
})();
</script>
</body>
</html>
